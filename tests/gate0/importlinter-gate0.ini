[importlinter]
root_package = src
include_external_packages = True

[importlinter:contract:contracts-independent]
name = Contract and model layers do not import runtime, provider, storage, transport, worker or voice adapters
type = forbidden
source_modules =
    src.contracts
    src.models
forbidden_modules =
    src.application
    src.integrations
    src.storage
    src.transport
    src.workers
    src.voice
    fastapi
    langgraph

[importlinter:contract:core-independent]
name = Core policy does not import Telegram, Google, owner filesystem, worker SDK or renderer paths
type = forbidden
source_modules =
    src.core
forbidden_modules =
    src.transport.telegram
    src.integrations
    src.application.owner_files
    src.application.owner_workspace
    src.application.product_effects
    src.workers
    src.voice

[importlinter:contract:google-isolated]
name = Google adapters do not import Telegram, local owner filesystem or credential-value adapters
type = forbidden
source_modules =
    src.integrations.google_calendar
    src.integrations.google_drive
    src.integrations.google_tasks
    src.integrations.google_transport
forbidden_modules =
    src.transport.telegram
    src.application.owner_files
    src.application.owner_workspace
    src.security.windows_credentials

[importlinter:contract:workers-no-effects]
name = Workers and task models do not invoke product effects directly
type = forbidden
source_modules =
    src.workers
    src.models
forbidden_modules =
    src.application.product_effects
    src.application.durable_product
